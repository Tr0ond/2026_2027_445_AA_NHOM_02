services:
  postgres:
    image: postgres:15
    container_name: travel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: be_chuyennganh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "3008:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
